# Builds the backend image, pushes it to GHCR, applies pending migrations
# and restarts it on the VPS (decision 0009). See docs/deployment.md.
# The job fails if a migration fails (the old container keeps serving) or
# if the new container doesn't pass its Compose health check.
name: Deploy backend
on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - packages/shared/**
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - apps/frontend/package.json
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never run two deploys at once. A newer push waits for the running one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecom-api:latest
            ghcr.io/${{ github.repository_owner }}/ecom-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "deploy@$DEPLOY_HOST" "cd ~/app \
            && docker compose pull ecom-api \
            && docker compose run --rm -T ecom-api npm run migration:run:prod \
            && docker compose up -d --wait --wait-timeout 90 ecom-api \
            && docker image prune -f"

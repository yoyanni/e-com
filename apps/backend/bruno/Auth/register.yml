info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "user@gmail.com",
        "password": "pass1234",
        "name": "user"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setGlobalEnvVar("accessToken", res.body.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

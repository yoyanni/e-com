info:
  name: login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "pass1234"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setGlobalEnvVar("accessToken", res.body.accessToken);
        bru.setGlobalEnvVar("refreshToken", res.body.refreshToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
